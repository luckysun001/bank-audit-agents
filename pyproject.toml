[tool.poetry]
name = "bank-audit-agents"
version = "1.0.0"
description = "银行审计部多智能体协作平台 - 基于多智能体系统的智能化审计解决方案"
authors = ["Bank AI Lab"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/opensource-ai-projects/bank-audit-agents"
keywords = ["multi-agent", "audit", "banking", "llm", "langchain", "agents", "ai", "artificial-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-community = "^0.0.20"
langchain-core = "^0.1.0"
langgraph = "^0.0.48"
langchain-chroma = "^0.1.0"
chromadb = "^0.4.0"
openai = "^1.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.20.0"}
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
structlog = "^24.0.0"
redis = "^5.0.0"
tenacity = "^8.2.0"
prometheus-client = "^0.20.0"
pypdf = "^4.0.0"
python-docx = "^1.1.0"
beautifulsoup4 = "^4.12.0"
tiktoken = "^0.6.0"
numpy = "^1.26.0"
pandas = "^2.0.0"
aiofiles = "^23.0.0"
httpx = "^0.26.0"
python-magic = "^0.4.0"
networkx = "^3.2.0"
pyvis = "^0.3.0"
streamlit = "^1.30.0"
plotly = "^5.18.0"
tabulate = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.0.0"
black = "^24.0.0"
ruff = "^0.2.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"
isort = "^5.0.0"
faker = "^20.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --cov=bank_audit_agents --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
