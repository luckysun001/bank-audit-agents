name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.10 已于 2026-10 EOL，且 chromadb 依赖的 onnxruntime >=1.24.4 只支持 3.11+
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: 安装 Poetry
        run: pipx install poetry
      - name: 安装依赖
        run: poetry install --with dev
      - name: 安装 Lint 工具
        run: pip install "black==24.4.2" "isort==5.13.2" "ruff==0.6.9"
      - name: Lint (ruff)
        run: ruff check .
      - name: 格式检查 (black)
        run: black --check .
      - name: 导入顺序检查 (isort)
        run: isort --check-only .
      - name: 运行测试
        run: poetry run pytest
