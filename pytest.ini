[pytest]
# 测试路径
testpaths = tests

# 测试文件模式
python_files = test_*.py

# 测试类和函数
python_classes = Test*
python_functions = test_*

# 启用 asyncio 支持
asyncio_mode = auto

# 日志级别
log_cli = true
log_cli_level = INFO

# 覆盖率配置
addopts = 
    -v
    --cov=bank_audit_agents
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --no-cov-on-fail

# 忽略的路径
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    data
    dist
    build
    htmlcov

# 标记
markers =
    slow: 标记慢速测试
    integration: 标记集成测试
    e2e: 标记端到端测试
